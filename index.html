<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی کیمیا - بەندی یەکەم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .question-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.7;
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
        }

        .option-btn {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #cbd5e1;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            direction: ltr;
            justify-content: flex-end;
        }

        .option-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #fff;
        }

        .option-btn.selected {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #0284c7, #9333ea);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 30px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
        }

        /* Result Section */
        #result-modal {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(#38bdf8 var(--percentage), #334155 0deg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            position: relative;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background: #0f172a;
        }

        .score-text {
            position: relative;
            font-size: 2.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .result-message {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .restart-btn {
            background: #334155;
            color: #fff;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .restart-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>تاقیکردنەوەی ئۆنلاینی کیمیا</h1>
        <p>تکایە وەڵامی ڕاست هەڵبژێرە (بیست پرسیار)</p>
    </header>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calculateScore()">تەواوکردن و بینینی ئەنجام</button>
    </form>

    <div id="result-modal">
        <h2 style="margin-bottom: 15px;">ئەنجامی تاقیکردنەوەکەت</h2>
        <div class="score-circle" id="score-circle">
            <span class="score-text" id="score-display">0/20</span>
        </div>
        <p class="result-message" id="result-message"></p>
        <button class="restart-btn" onclick="location.reload()">دووبارە هەوڵدانەوە</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "پ ١٠١/ بەنزینی خاوێن لە 5.45°C دا دەبەستێت، ئەگەر پلەی بەستنی گیراوەیەک 7.24g ی له 115g بەنزین تواوەی تێدابێت بباتە 3.55°C بەهای Kf ی بەنزین چەندە؟ بارستە مۆڵی = 168g/mol",
            options: ["A) -5.07 °C/m", "B) +5.07 °C/m", "C) -7.05 °C/m", "D) +7.05 °C/m"],
            correct: 1
        },
        {
            q: "پ ١٠٢/ چەند گرام ماددەی دژه بەستن C2H4(OH)2 پێویسته بۆ هەر 500g ئاو، بۆ ئەوەی لە -20°C دا نەبەستێت؟ مۆڵە بارستەی C2H4(OH)2 دەکاتە 62g/mol.",
            options: ["A) 275.5g", "B) 3.72g", "C) 333.33g", "D) 666.66g"],
            correct: 2
        },
        {
            q: "پ ١٠٣/ پلەی بەستنی ئاوەگیراوەیەک دەکاتە -0.6652°C. بڕێکی نەزانراو توابوو لەسەر ئاوەکە، کە زانراوه (Kf = -1.86°C/m). مۆلالیتی گیراوەکە چەندە؟",
            options: ["A) 0.010 m", "B) 0.355 m", "C) 0.358 m", "D) 2.66 m"],
            correct: 2
        },
        {
            q: "پ ١٠٤/ 2mol/kg توابوو لە ئاوەگیراوەیەکدا توێنرایەوە کە وای لێهات لەخوار پلەی بەستنی ئاساییەوە بە 7.8°C ببەستێت. جێگیری پلەی بەستنی مۆڵالی Kf چەندە؟",
            options: ["A) -1.86 °C/m", "B) -3.9 °C/m", "C) -5.08 °C/m", "D) -14.5 °C/m"],
            correct: 1
        },
        {
            q: "پ ١٠٥/ کام لەم گیراوانە نزمترین پلەی بەستنی هەیە؟",
            options: ["A) Ca(NO3)2 0.01m", "B) KBr 0.02m", "C) C6H12O6 0.02m", "D) AlCl3 0.005m"],
            correct: 1
        },
        {
            q: "پ ١٠٦/ بە بەراورد بە ئاوە گیراوەی KCl دا بەزینی کرده‌یی لە پلەی بەستنی ئاوە گیراوەی MgSO4 له هەمان خەستی دا کەمیك کەمترە بە هۆی:",
            options: ["A) یەکتر ڕاکێشانی ئایۆنەکان", "B) دوورکەوتنەوەی ئایۆنەکان", "C) ژمارەیی مۆڵی ئایۆنەکان", "D) جیاوازی بەهای Kf"],
            correct: 0
        },
        {
            q: "پ ١٠٧/ لەکام لەم گیراوانەی خوارەوەدا Δtf = Kf؟",
            options: ["A) 2m C6H12O6", "B) 1m KCl", "C) 0.5m NaNO3", "D) 1m K2CO3"],
            correct: 2
        },
        {
            q: "پ ١٠٨/ کام لەم گیراوانه ناویانه لەوانەدا Δtf = 2Kf ؟",
            options: ["A) 0.5m MgSO4", "B) 0.5m C6H12O6", "C) 1.0m KCl", "D) 1.0m Na3PO4"],
            correct: 2
        },
        {
            q: "پ ١٠٩/ ئەگەر پلەی بەستنی ئاوە گیراوەیەکی Ba(NO3)2 بکاتە -2.65°C, ئایا خەستی مۆلالیتی ئەم گیراوەیە چەندە؟",
            options: ["A) 1.425m", "B) 0.4750m", "C) 5.196m", "D) 1.732 m"],
            correct: 1
        },
        {
            q: "پ ١١٠/ پلەی بەستنی ئاوە گیراوەی KCl دەکاتە -3.72°C. پلەی بەستنی هەمان خەستی ئاوە گیراوەی Ca(NO3)2 چەندە؟",
            options: ["A) -1.86°C", "B) -7.44°C", "C) -3.72°C", "D) -5.58°C"],
            correct: 3
        },
        {
            q: "پ ١١١/ دابەزینی نزیکەیی پلەی بەستنی ئاوە گیراوەیەکی 0.05m FeCl3 دەکاتە؟",
            options: ["A) 0.019", "B) -0.093", "C) -0.28", "D) -0.372"],
            correct: 3
        },
        {
            q: "پ ١١٢/ بە بەراورد لەگەڵ ئاوە گیراوەی شەکری 0.01m گیراوەی 0.01m KCl:",
            options: ["A) هەمان نزم بوونه‌وەی پلەی بەستنی هەیە", "B) دووەنەوه نزم بوونه‌وەی پلەی بەستنی هەیە", "C) هەمان بەرزبوونه‌وەی پلەی بەستنی هەیە", "D) شەش ئەوەنده بەرز بوونه‌وەی پلەی بەستنی هەیە"],
            correct: 1
        },
        {
            q: "پ ١١٣/ ئاوە گیراوەیەکی خەستی 1m و پلەی بەستنی یەکسانه بە -3.72°C دەشێت ببێته گیراوەی:",
            options: ["A) AlCl3", "B) BaCl2", "C) NaCl", "D) C6H12O6"],
            correct: 3
        },
        {
            q: "پ ١١٤/ پلەی کوڵانی ئاوە گیراوەیەکی کە ئاopen گیراوە لەگەڵ نەزانراو بە هەمان خەستی:",
            options: ["A) 102.04 °C", "B) 1.02 °C", "C) 101.02 °C", "D) 100.51 °C"],
            correct: 2
        },
        {
            q: "پ ١١٥/ کام لەم گیراوانەی خوارەوە بەرزترین پلەی کوڵانی هەیە؟",
            options: ["A) Ca(NO3)2 0.01m", "B) KBr 0.02m", "C) C6H12O6 0.02m", "D) AlCl3 0.005m"],
            correct: 3
        },
        {
            q: "پ ١١٦/ بەراوردی پلەی کوڵانی ئاوەگیراوەیەکی Na3PO4:",
            options: ["A) 0.20m", "B) 0.05m", "C) 0.40m", "D) 0.80m"],
            correct: 1
        },
        {
            q: "پ ١١٧/ کامیان بەرزترین پلەی کوڵانی کرده‌یی هەیە ئەگەر هەمان خەستیان هەبێ؟",
            options: ["A) MgSO4", "B) NaCl", "C) C6H12O6", "D) هیچیان"],
            correct: 1
        },
        {
            q: "پ ١١٨/ ئەگەر پلەی کوڵانی ئاوەگیراوەی Na3PO4 بکاتە 100.408°C خەستی مۆلالی گیراوەکە چەندە؟",
            options: ["A) 0.20m", "B) 0.05m", "C) 0.40m", "D) 0.80m"],
            correct: 0
        },
        {
            q: "پ ١١٩/ چەند گرام لە توابوو لە ناپێکهاتەیی ئایۆنیدا بۆ 400g ئاو بۆئەوەی پلەی کوڵان بکاتە 100.415°C؟ (بارستەی مۆڵی توابوو = 62g/mol و Kb = 0.51°C/m)",
            options: ["A) 20g", "B) 0.81g", "C) 124g", "D) 30.25g"],
            correct: 0
        },
        {
            q: "پ ١٢٠/ پلەی کوڵانی ئاوەگیراوەی گلوکۆز دەکاتە 100.102°C ئەوا پلەی کوڵانی پێشبینیکراوی کام لەم ئاوەگیراوانە بەهەمان خەستی دەکاتە 100.306°C؟ (Kb = 0.51°C/m)",
            options: ["A) KNO3", "B) CaCl2", "C) AlCl3", "D) NH4Cl"],
            correct: 1
        }
    ];

    const container = document.getElementById('questions-container');

    // Load Questions
    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerText = q.q;
        card.appendChild(title);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        q.options.forEach((opt, optIdx) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, optIdx, btn);
            optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);
        container.appendChild(card);
    });

    const userAnswers = {};

    function selectOption(qIdx, optIdx, btnElement) {
        userAnswers[qIdx] = optIdx;
        const parent = btnElement.parentElement;
        Array.from(parent.children).forEach(child => child.classList.remove('selected'));
        btnElement.classList.add('selected');
    }

    function calculateScore() {
        if (Object.keys(userAnswers).length < quizData.length) {
            alert('تکایە وەڵامی هەموو پرسیارەکان بدەرەوە پێش ئەوەی ئەنجام وەربگریت!');
            return;
        }

        let score = 0;
        quizData.forEach((q, i) => {
            if (userAnswers[i] === q.correct) {
                score++;
            }
        });

        document.getElementById('quiz-form').style.display = 'none';
        const resultModal = document.getElementById('result-modal');
        resultModal.style.display = 'block';

        const percentage = (score / 20) * 360;
        document.getElementById('score-circle').style.setProperty('--percentage', `${percentage}deg`);
        document.getElementById('score-display').innerText = `${score}/20`;

        const msg = document.getElementById('result-message');
        if (score >= 18) {
            msg.innerText = "ئاستێکی زۆر زۆر بەرز و نایاب! دەستت خۆش بێت 🌟";
            msg.style.color = "#4ade80";
        } else if (score >= 12) {
            msg.innerText = "ئاستێکی باشە، هەوڵی زیاتر بدە! 👍";
            msg.style.color = "#facc15";
        } else {
            msg.innerText = "پێویستت بە پێداچوونەوە و هەوڵدانی زیاتر هەیە 📚";
            msg.style.color = "#f87171";
        }
    }
</script>

</body>
</html>
